<!doctype html><meta charset="utf-8"><title>Original positioned clipping fixture</title>
<style>html,body{margin:0}.clip{position:relative;margin:10px;width:160px;height:80px;padding:10px;border:3px solid #365075;border-radius:16px;overflow:hidden;background:#dde9fa}.absolute{position:absolute;left:120px;top:20px;width:120px;height:60px;background:rgba(226,89,104,0.7);border-radius:12px}.relative{position:relative;left:-30px;top:40px;width:100px;height:35px;background:#76be98}.visible{position:relative;margin:10px;width:160px;height:80px;padding:10px;border:3px solid #365075;border-radius:16px;background:#dde9fa}</style>
<div class="clip">Clipped parent<div class="absolute">Absolute outside</div><div class="relative">Shifted outside</div></div><div class="visible">Visible overflow<div class="absolute">Absolute outside</div></div>
