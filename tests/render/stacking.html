<!doctype html><meta charset="utf-8"><title>Original scoped stacking fixture</title>

<div class="stage"><div class="box negative">Negative</div><div class="box auto">Auto</div><div class="box zero">Zero<div class="nested">Nested 999</div></div><div class="box positive">Positive 2</div><div class="sibling">Sibling 3</div></div>
