[package]
name = "scarlite"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Scarlite browser project and Phos rendering engine"
repository = "https://github.com/saudaljuaid/Scarlite"
readme = "README.md"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
serde_json = "1"

[lib]
name = "phos"
path = "src/lib.rs"

[[bin]]
name = "scarlite"
path = "src/main.rs"

[[bin]]
name = "librefly"
path = "src/bin/librefly.rs"
